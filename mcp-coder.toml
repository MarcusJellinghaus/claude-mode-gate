# mcp-coder workflow config for this npm repo (mcp-coder docs: configuration/toolkits.md, setup.md).
# mcp-coder reads only [tool.mcp-coder.setup] and [tool.mcp-coder.toolkit] from this file.

# types:lay needs Claude Code on the PATH; without the engine types typecheck cannot pass.
[tool.mcp-coder.setup]
steps = [ { name = "deps", argv = ["npm", "ci"] },
          { name = "types", argv = ["npm", "run", "types:lay"] } ]

[tool.mcp-coder.toolkit]
toolkit = "command"

# Declare only the depths the default bindings request. Every declared step is granted
# to the implement and CI-fix sessions and listed for the LLM to re-run, requested or not.
[tool.mcp-coder.toolkit.command.format]
apply = [ { argv = ["npm", "run", "format"] } ]

# The gates of `npm run check` (scripts/check.mjs) as separate steps, so each failure is
# its own finding. Left out: format:check (mcp-coder formats before every commit) and
# test:coverage (the test action runs it). npm passes a script's exit code on unchanged:
# tsc exits 1 or 2 on type errors, depcruise exits with its violation count. The default
# { 0 = "ok", 1 = "findings" } fits the rest; ESLint and knip use 2 for a crash.
[tool.mcp-coder.toolkit.command.check]
quick    = [ { argv = ["npm", "run", "typecheck"], exit_codes = { 0 = "ok", 1 = "findings", 2 = "findings" } },
             { argv = ["npm", "run", "lint"] } ]
standard = [ { argv = ["npm", "run", "typecheck"], exit_codes = { 0 = "ok", 1 = "findings", 2 = "findings" } },
             { argv = ["npm", "run", "lint"] },
             { argv = ["npm", "run", "arch"], exit_codes = { 0 = "ok", 1 = "findings", 2 = "findings", 3 = "findings", 4 = "findings", 5 = "findings", 6 = "findings", 7 = "findings", 8 = "findings", 9 = "findings" } },
             { argv = ["npm", "run", "deadcode"] },
             { argv = ["npm", "run", "docs:lint"] },
             { argv = ["npm", "run", "check:manifests"] },
             { argv = ["npm", "run", "check:catch"] },
             { argv = ["npm", "run", "check:pins"] },
             { argv = ["npm", "run", "check:docs"] } ]

# test:coverage is the gate CI and `npm run check` use. Tests report by exit code:
# vitest writes no JUnit report here.
[tool.mcp-coder.toolkit.command.test]
quick      = [ { argv = ["npm", "run", "test:coverage"] } ]
standard   = [ { argv = ["npm", "run", "test:coverage"] } ]
unattended = [ { argv = ["npm", "run", "test:coverage"] } ]
